# Every Go command runs inside the flake's dev shell: gcc, pkg-config and
# golangci-lint are not on PATH outside it.
tools:
  fmt: nix develop -c bash -c 'unformatted=$(gofmt -l .) || exit; echo "$unformatted"; test -z "$unformatted"'
  vet: nix develop -c go vet ./...
  lint: nix develop -c golangci-lint run ./...
  test: nix develop -c go test ./...
  race: nix develop -c go test -race -timeout 30m ./...
  pytest: nix build -L --no-link .#checks.x86_64-linux.qwen-tts-server-tests

tags:
  audio: [internal/audio/**, internal/fft/**]
  voices: [internal/voices/**]
  upstream: [internal/upstream/**]
  server: [internal/openai/**, internal/pipeline/**, internal/wyoming/**]
  runtime: [cmd/llama-swap-voice/**]
  tts-server: [python/**, nix/qwen-tts-server/**]
  build: [go.mod, go.sum, .golangci.yaml, .claude/review/review.yaml, flake.nix, flake.lock, gomod2nix.toml, nix/**, .cog.toml]
  llm: [AGENTS.md, CLAUDE.md, .claude/review/*.md, .claude/review/review.yaml]

dimensions:
  - name: correctness
    criteria: correctness.md
    always: true
  - name: security
    criteria: security.md
    tags: [audio, voices, upstream, server, runtime, build, tts-server]
  - name: failure-paths
    criteria: failure-path-review.md
    signals: [packages_touched>0]
  - name: qa
    criteria: qa.md
    signals: [code_without_tests, tests_changed]
  - name: design
    criteria: design.md
    signals: [packages_touched>=2, new_exported>0]
  - name: prompt
    criteria: prompt.md
    tags: [llm]

max_dimensions: 4

verify_notes: |
  Run every Go command inside the flake's dev shell,
  `nix develop -c <command>`;
  outside it cgo fails with "could not import C". Tests need no GPU, model or
  running llama-swap: HTTP tests drive the real handlers against the fake
  upstream in internal/openai/harness_test.go, pipeline tests use their
  own fake in internal/pipeline/fake_test.go, and Wyoming tests use a fake
  client and their own fake upstream in internal/wyoming/harness_test.go. opus-tools (opusinfo, opusdec)
  and ffmpeg are test oracles in internal/audio/oracle_test.go and
  internal/openai/speech_encoding_test.go whose checks skip silently when the
  tools are missing, so run with them present and use -v to confirm they ran.
  tools/race.txt covers every package; internal/audio takes about 70 s on 16 cores.
  A verifier works read-only on tracked files, which is stricter than what
  AGENTS.md allows a builder: do not replace, regenerate or delete a file
  under internal/audio/testdata/, delete a fuzz seed, edit .golangci.yaml,
  run go get, or push. To inspect module tidiness use `go mod tidy -diff`.
  The dev shell provides no Python for the server under python/; a python3
  on PATH comes from outside it and lacks the server's dependencies. The whole
  GPU-free suite is
  `nix build -L --no-link .#checks.x86_64-linux.qwen-tts-server-tests`.
  For one test, `env=$(nix build --no-link --print-out-paths .#qwen-tts-server.testEnv)`
  and then, from python/,
  `$env/bin/python -B -m pytest -p no:cacheprovider tests/<file> -k <name>`.
  Never run `uv run` or `uv lock`, which write python/.venv and python/uv.lock,
  and never build .#qwen-tts-server for a review: it downloads several GB of
  CUDA wheels.
